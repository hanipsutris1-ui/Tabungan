<meta name="claude:viewport-fit-sides" content="cover">
<title>Tabungan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: satu kolom ala aplikasi HP — ringkasan, anggota, rekap seperti buku kas; tombol Setor melayang di tengah bar kaca. */
:root{
  --bg:#EDF2F0;--surf:#FFFFFF;--surf2:#F3F7F6;--ink:#0F211D;--mut:#5A6E69;--line:#D7E1DE;
  --pri:#0B5D55;--onpri:#FFFFFF;--acc:#E39B0B;--onacc:#2B1B00;--good:#1B7A4B;--bad:#B3402E;
  --soft:#DCEBE8;--hero:#0B5D55;--herot:#F1FBF8;--glass:rgba(255,255,255,.72);--glassb:rgba(255,255,255,.85);
  --sh:0 12px 32px rgba(10,50,45,.16);--bar:#7FB5AE;
  --fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1513;--surf:#12211E;--surf2:#0F1C19;--ink:#E5F0ED;--mut:#8FA8A2;--line:#213733;
  --pri:#46B8A8;--onpri:#04211D;--acc:#F0B13A;--onacc:#2B1B00;--good:#5CC592;--bad:#EE8A77;
  --soft:#183A35;--hero:#0F3F3A;--herot:#EAF8F5;--glass:rgba(18,33,30,.62);--glassb:rgba(255,255,255,.14);
  --sh:0 12px 32px rgba(0,0,0,.5);--bar:#2F6D65;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1513;--surf:#12211E;--surf2:#0F1C19;--ink:#E5F0ED;--mut:#8FA8A2;--line:#213733;
  --pri:#46B8A8;--onpri:#04211D;--acc:#F0B13A;--onacc:#2B1B00;--good:#5CC592;--bad:#EE8A77;
  --soft:#183A35;--hero:#0F3F3A;--herot:#EAF8F5;--glass:rgba(18,33,30,.62);--glassb:rgba(255,255,255,.14);
  --sh:0 12px 32px rgba(0,0,0,.5);--bar:#2F6D65;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);min-height:100%;
  background-image:radial-gradient(700px 320px at 100% -6%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(640px 360px at -10% 4%,color-mix(in srgb,var(--pri) 16%,transparent),transparent 70%);background-attachment:fixed}
#app{max-width:640px;margin:0 auto;padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer}
small,.sm{display:block;color:var(--mut);font-size:12px;font-weight:400}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(11,93,85,.3)}
.brand b{display:block;font:700 17px/1.1 var(--fd);white-space:nowrap}.brand span{display:block;font-size:12px;color:var(--mut);letter-spacing:.02em}
.logo svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand>div:last-child{min-width:0}
.brand span.av{display:grid;color:var(--pri);font-size:21px;letter-spacing:0}
.chipb{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:8px 12px;font:600 13px var(--fb);display:flex;gap:6px;align-items:center;white-space:nowrap;max-width:40%;flex:none}
.chipb i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
/* hero */
.hero{background:var(--hero);color:var(--herot);border-radius:26px;padding:22px 22px 20px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;right:-56px;top:-56px;width:190px;height:190px;border-radius:50%;border:2px solid rgba(255,255,255,.16);box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 44px rgba(255,255,255,.035)}
.hero small{color:inherit;opacity:.74;position:relative}
.hero .big{font:700 clamp(32px,9vw,42px)/1.1 var(--fd);letter-spacing:-.01em;margin:6px 0 4px;position:relative;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;position:relative}
.hero .row b{display:block;font:600 15px var(--fb)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 13px;min-width:0}
.st b{display:block;font:700 20px var(--fd);margin-top:2px}
/* sections */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{font-size:18px}.sec button.lnk{border:0;background:none;color:var(--pri);font:600 13px var(--fb);padding:2px}
:root[data-theme="dark"] .lnk{color:var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pad{padding:16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}.li>div{flex:1;min-width:0}.li b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li:hover{background:var(--surf2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font:700 16px var(--fd);flex:none}
:root[data-theme="dark"] .av{color:var(--acc)}
.amt{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.mut{color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--pri)}
.pill.w{background:color-mix(in srgb,var(--acc) 22%,transparent);color:color-mix(in srgb,var(--acc) 70%,var(--ink))}
/* bar chart */
.chart{display:flex;gap:6px;align-items:flex-end;height:160px;padding:16px 12px 10px}
.chart button{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .v{font-size:9.5px;color:var(--mut);height:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--bar);min-height:3px;transition:height .25s}
.chart .m{font-size:10.5px;color:var(--mut);font-weight:500}
.chart button.on .b{background:var(--acc)}.chart button.on .m,.chart button.on .v{color:var(--ink);font-weight:700}
.sel{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surf2)}
.meter{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--pri);border-radius:9px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:14px;padding:12px 14px;font:600 14px var(--fb);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.acc{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.dng{color:var(--bad)}.btn:disabled{opacity:.5}
.ar{display:flex;gap:8px;margin-top:14px}.ar>*{flex:1}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:11px;font:600 13px var(--fb);color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surf2);color:var(--ink);border-radius:13px;padding:12px;font:16px var(--fb)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.qs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.qs button{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 12px;font:600 13px var(--fb)}
.back{border:0;background:none;color:var(--mut);font:600 14px var(--fb);padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.empty{padding:26px 18px;text-align:center;color:var(--mut)}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surf));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:16px;padding:16px;margin-top:16px}
/* rekap table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surf)}
table.tb{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tb thead th{background:var(--surf2);color:var(--mut);font-weight:600;font-size:11.5px;position:sticky;top:0}
.tb th.no{position:sticky;left:0;width:34px;min-width:34px;text-align:center;padding:9px 4px;background:var(--surf);color:var(--mut);font-weight:600;z-index:1}
.tb thead th.no{background:var(--surf2);z-index:2}
.tb tbody tr:nth-child(even) th.no{background:var(--surf2)}
.tb tfoot th.no{background:var(--soft)}
.tb th.n{position:sticky;left:34px;text-align:left;background:var(--surf);min-width:116px;max-width:132px;overflow:hidden;text-overflow:ellipsis;font-weight:600;z-index:1;border-right:1px solid var(--line);cursor:pointer}
.tb thead th.n{background:var(--surf2);z-index:2}
.tb tbody tr:nth-child(even) td,.tb tbody tr:nth-child(even) th.n{background:var(--surf2)}
.tb td{min-width:50px;cursor:pointer}.tb td.z{color:color-mix(in srgb,var(--mut) 55%,transparent)}
.tb td.t{font-weight:700;min-width:70px}
.tb tfoot th,.tb tfoot td{font-weight:700;background:var(--soft);border-bottom:0;color:var(--ink)}
.tb th small{display:block;font-weight:400;font-size:10px}
/* month tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:10px 11px;text-align:left}
.tile small{font-size:11px}.tile b{display:block;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.empty0 b{color:var(--mut);font-weight:500}
.tile.has{background:var(--soft);border-color:transparent}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 28px));z-index:5;
  display:grid;align-items:center;padding:6px;border:1px solid var(--glassb);border-radius:34px;background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.4)}
nav.w5{grid-template-columns:1fr 1fr 68px 1fr 1fr}nav.w4{grid-template-columns:repeat(4,1fr)}
nav .t{border:0;background:none;color:var(--mut);font:600 11px var(--fb);display:grid;justify-items:center;gap:3px;padding:7px 2px;border-radius:26px}
nav .t.on{background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri)}
:root[data-theme="dark"] nav .t.on{color:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .go{width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 8px 20px rgba(227,155,11,.45);font:700 11px var(--fb)}
nav .go svg{width:26px;height:26px;stroke-width:2.4}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(6,16,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--surf);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.shh h2{font-size:20px}
.x{border:0;background:var(--surf2);width:34px;height:34px;border-radius:50%;color:var(--mut);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:13px;font-weight:500;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--sh)}
.toast button{border:0;background:none;color:var(--acc);font:700 13px var(--fb);padding:0}
:root[data-theme="dark"] .toast button{color:#8B5A00}
/* slip */
.slip{background:#fff;color:#16211e;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.slip .h{background:#0B5D55;color:#fff;padding:14px 16px}.slip .h b{font:700 16px var(--fd);display:block}.slip .h span{font-size:12px;opacity:.8}
.slip .b{padding:12px 16px}.slip .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.slip hr{border:0;border-top:1px dashed #c9d6d3;margin:8px 0}
.slip .r.k{font-weight:700;font-size:16px}.slip .r.new{background:#FFF3D6;margin:0 -8px;padding:5px 8px;border-radius:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Tab atas Warga | Pribadi ===== */
.seg.mode{margin:0 0 16px;background:color-mix(in srgb,var(--pri) 14%,var(--surf))}
.seg.mode button{padding:10px 6px;font-size:14px}
/* ===== Mode Pribadi: biru langit, gaya aplikasi bank ===== */
body[data-mode="pribadi"]{--bg:#EAF5FD;--surf:#FFFFFF;--surf2:#F1F8FE;--ink:#0B2A43;--mut:#557186;--line:#D2E5F3;
  --pri:#0B7AD1;--onpri:#FFFFFF;--acc:#1593EA;--onacc:#FFFFFF;--soft:#D9ECFB;
  --hero:linear-gradient(155deg,#2A9FEF 0%,#1286E0 48%,#0B6FC4 100%);--herot:#FFFFFF;--bar:#8CC6F0;
  --glass:rgba(255,255,255,.74);--glassb:rgba(255,255,255,.88);--sh:0 12px 32px rgba(11,100,180,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-mode="pribadi"]{
  --bg:#07131D;--surf:#0E2234;--surf2:#0B1B2A;--ink:#E3F1FB;--mut:#8DB0C8;--line:#1B3A52;
  --pri:#5CB8F5;--onpri:#04243C;--acc:#3AA5EE;--onacc:#04243C;--soft:#12304A;
  --hero:linear-gradient(155deg,#1C6FB0,#0C4A7E);--herot:#FFFFFF;--bar:#2B6C9E;
  --glass:rgba(14,34,52,.64);--glassb:rgba(255,255,255,.14);--sh:0 12px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"] body[data-mode="pribadi"]{
  --bg:#07131D;--surf:#0E2234;--surf2:#0B1B2A;--ink:#E3F1FB;--mut:#8DB0C8;--line:#1B3A52;
  --pri:#5CB8F5;--onpri:#04243C;--acc:#3AA5EE;--onacc:#04243C;--soft:#12304A;
  --hero:linear-gradient(155deg,#1C6FB0,#0C4A7E);--herot:#FFFFFF;--bar:#2B6C9E;
  --glass:rgba(14,34,52,.64);--glassb:rgba(255,255,255,.14);--sh:0 12px 32px rgba(0,0,0,.5)}
body[data-mode="pribadi"] nav .go{box-shadow:0 8px 20px rgba(21,147,234,.45)}
.pband{margin:-14px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:16px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px));
  background:var(--hero);color:#fff;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.pband::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.pband>*{position:relative;z-index:1}
.pband .bar{margin-bottom:14px}
.pband .brand span{color:rgba(255,255,255,.85)}
.pband .logo{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.pband .seg.mode{background:rgba(255,255,255,.22);margin-bottom:14px}
.pband .seg.mode button{color:rgba(255,255,255,.9)}
.pband .seg.mode button.on{background:#fff;color:#0B6FC4;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ptitle{font:700 26px var(--fd);margin:4px 0 2px;color:#fff}
.pbal{padding:2px 0 28px}.pbal small{color:rgba(255,255,255,.88)}
.pbal .big{font:700 clamp(30px,9vw,40px)/1.1 var(--fd);letter-spacing:-.01em}
.balr{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.eye{border:0;background:rgba(255,255,255,.22);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.eye svg,.qm svg,.av svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.eye svg{width:20px;height:20px}
.qm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:14px 8px;margin-top:-30px;position:relative;z-index:2;box-shadow:var(--sh)}
.qm button{border:0;background:none;display:grid;justify-items:center;gap:8px;font:600 12px var(--fb);color:var(--ink)}
.qm i{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--pri)}
.qm svg{width:24px;height:24px}
.accs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.acct{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border:0;border-radius:22px;padding:18px;color:#fff;text-align:left;display:grid;gap:3px;
  background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 10px 24px rgba(11,100,180,.22);position:relative;overflow:hidden}
.acct::after{content:"";position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.acct small{color:rgba(255,255,255,.88)}.acct .an{font:700 20px var(--fd)}.acct .ab{font:700 24px var(--fd);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.av.cr{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.av.db{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.av svg{width:20px;height:20px}
.gh{padding:10px 14px 6px;font:600 12px var(--fb);color:var(--mut);background:var(--surf2);border-bottom:1px solid var(--line);letter-spacing:.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chips button{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:8px 14px;font:600 13px var(--fb);white-space:nowrap}
.chips button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
/* ===== Mode Dompetku: ungu, pencatat harian ===== */
body[data-mode="dompet"]{--bg:#F3F0FC;--surf:#FFFFFF;--surf2:#F7F5FE;--ink:#1D1640;--mut:#665F8A;--line:#E2DDF5;
  --pri:#5B3FD9;--onpri:#FFFFFF;--acc:#7C5CF0;--onacc:#FFFFFF;--soft:#E7E1FB;
  --hero:linear-gradient(155deg,#7A5CF2 0%,#5B3FD9 50%,#4429B8 100%);--herot:#FFFFFF;--bar:#B3A3F2;
  --glass:rgba(255,255,255,.74);--glassb:rgba(255,255,255,.88);--sh:0 12px 32px rgba(70,40,180,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-mode="dompet"]{
  --bg:#100C20;--surf:#1A1433;--surf2:#150F2B;--ink:#ECE8FB;--mut:#A39BCB;--line:#2C2352;
  --pri:#A590FF;--onpri:#1A0F4D;--acc:#8E74F7;--onacc:#1A0F4D;--soft:#2A2152;

<script>
"use strict";
const $=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>(n<0?"-":"")+"Rp"+Math.round(Math.abs(n)).toLocaleString("id-ID");
const rb=n=>n?(n/1000).toLocaleString("id-ID",{maximumFractionDigits:1}):"";
const jt=n=>!n?"":n>=1e6?(n/1e6).toLocaleString("id-ID",{maximumFractionDigits:2})+" jt":Math.round(n/1000)+" rb";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const tgl=s=>s?new Date(s+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"—";
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ini=n=>((n||"?").replace(/^(ibu|bu|pak|bapak|mas|mbak)\s+/i,"")[0]||"?").toUpperCase();
const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const ICON={
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  people:'<circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c0-3.6 2.9-5.6 6.5-5.6s6.5 2 6.5 5.6"/><path d="M16.5 4.6a3.6 3.6 0 0 1 0 6.8M21.5 20c0-2.8-1.8-4.6-4-5.3"/>',
  grid:'<rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M9.5 9.5V20M15 9.5V20"/>',
  more:'<circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wallet:'<path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h12a2 2 0 0 1 2 2v1.5"/><path d="M3.5 7.5V17a2 2 0 0 0 2 2H19a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 19 8H6"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  list:'<path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4" cy="6.5" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="17.5" r=".8"/>',
  down:'<path d="M12 4v12M6.5 11 12 16.5 17.5 11"/><path d="M5 20.5h14"/>',
  up:'<path d="M12 20V8M6.5 13 12 7.5 17.5 13"/><path d="M5 3.5h14"/>',
  share:'<circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="6" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="M8.1 10.8l7.3-3.6M8.1 13.2l7.3 3.6"/>',
  file:'<path d="M6 3.5h8l4.5 4.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4.5M9 13l5 5M14 13l-5 5"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  eyeoff:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path d="M4 4l16 16"/>',
  coin:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 10c0-1 1-1.6 2.5-1.6s2.5.6 2.5 1.6-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.6 2.5 1.6 2.5-.6 2.5-1.6"/>'
};
const ic=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- state ---------- */
let db=null,canW=true,xlsxOk=false,dl=null;
const S={mode:"dompet",dtab:"home",dm:null,df:"",ptab:"home",pp:null,pf:"",hide:false,tab:"home",mid:null,q:"",sort:"nama",bi:null,pid:null,all:false,ready:{},err:null};
let M=[],SE=[],TR=[],P=[],PO=[],PS=[],PT=[],isAdm=false;

/* ---------- data helpers ---------- */
const per=()=>P.find(p=>p.id===S.pid)||P.find(p=>p.aktif)||P[P.length-1];
function mlabel(p,b,long){const [y,m]=p.mulai.split("-").map(Number),d=new Date(y,m-1+b,1);return long?BLN[d.getMonth()]+" "+d.getFullYear():BLN[d.getMonth()].slice(0,3)}
function myear(p,b){const [y,m]=p.mulai.split("-").map(Number);return new Date(y,m-1+b,1).getFullYear()}
function agg(){
  const p=per(),n=p.n,cell={},tot={},tk={},bln=Array(n).fill(0),cnt=Array(n).fill(0);
  M.forEach(m=>{cell[m.id]=Array(n).fill(0);tot[m.id]=0;tk[m.id]=0});
  SE.forEach(x=>{if(x.pid!==p.id||!cell[x.mid]||x.b>=n)return;cell[x.mid][x.b]+=x.jml;tot[x.mid]+=x.jml;bln[x.b]+=x.jml});
  TR.forEach(x=>{if(x.pid!==p.id||!(x.mid in tk))return;tk[x.mid]+=x.jml});
  M.forEach(m=>cell[m.id].forEach((v,b)=>{if(v>0)cnt[b]++}));
  const grand=bln.reduce((s,v)=>s+v,0),grandTk=Object.values(tk).reduce((s,v)=>s+v,0);
  const aktif=M.filter(m=>tot[m.id]>0).length;
  return{p,n,cell,tot,tk,bln,cnt,grand,grandTk,kas:grand-grandTk,aktif};
}
function curB(a){
  const p=a.p;if(S.bi!=null&&S.bi<p.n)return S.bi;
  const now=new Date(),[y,m]=p.mulai.split("-").map(Number),i=(now.getFullYear()-y)*12+now.getMonth()+1-m;
  if(i>=0&&i<p.n)return i;
  for(let b=p.n-1;b>=0;b--)if(a.bln[b])return b;return 0;
}
const sortM=()=>M.sort((x,y)=>(x.no||0)-(y.no||0)||x.nama.localeCompare(y.nama));

async function put(col,obj){const i=obj.id||uid(col[0]);const d={...obj};delete d.id;await db.collection(col).doc(i).set(d);return i}
const del=(col,i)=>db.collection(col).doc(i).delete();
const fail=e=>toast(e&&e.code==="quota_exceeded"?"Penyimpanan penuh. Hapus data lama dulu.":"Gagal menyimpan. Periksa koneksi lalu coba lagi.");

/* ---------- ui helpers ---------- */
let tt;
function toast(msg,label,fn){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${E(msg)}</span>${label?`<button>${E(label)}</button>`:""}`;
  if(label)t.querySelector("button").onclick=()=>{t.remove();fn()};
  document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),label?6500:2600);
}
function sheet(title,body,o={}){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sh" role="dialog" aria-label="${E(title)}"><div class="shh"><h2>${E(title)}</h2><button class="x" data-c aria-label="Tutup">✕</button></div><div>${body}</div>${o.onOk||o.onDel?`<div class="ar">${o.onDel?'<button class="btn dng" data-d>Hapus</button>':""}${o.onOk?`<button class="btn pri" data-s>${E(o.ok||"Simpan")}</button>`:""}</div>`:""}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener("click",async e=>{
    const t=e.target;
    if(t===ov||t.closest("[data-c]")){close();return}
    const s=t.closest("[data-s]"),d=t.closest("[data-d]");
    if(s){s.disabled=true;try{if(await o.onOk()!==false)close()}catch(x){fail(x)}s.disabled=false}
    else if(d){if(!d.dataset.arm){d.dataset.arm=1;d.textContent="Ketuk lagi untuk menghapus";return}
      d.disabled=true;try{await o.onDel();close()}catch(x){fail(x);d.disabled=false}}
  });
  return{ov,close};
}
const ft=(id)=>document.getElementById(id);

/* ---------- forms ---------- */
function memberOpts(sel){return `<option value="">Pilih anggota…</option>`+M.map(m=>`<option value="${m.id}"${m.id===sel?" selected":""}>${E(m.nama)}</option>`).join("")}
function monthOpts(p,sel){let h="";for(let b=0;b<p.n;b++)h+=`<option value="${b}"${b===sel?" selected":""}>${mlabel(p,b,1)}</option>`;return h}

function fSetor(o={}){
  const a=agg(),p=a.p,e=o.id&&SE.find(x=>x.id===o.id);
  const d=e||{mid:o.mid||"",b:o.b!=null?o.b:curB(a),jml:"",tgl:today(),cat:""};
  const {close}=sheet(e?"Ubah setoran":"Setoran baru",
   `<label for="f-mid">Anggota</label><select id="f-mid">${memberOpts(d.mid)}</select>
    <label for="f-b">Untuk bulan</label><select id="f-b">${monthOpts(p,d.b)}</select>
    <label for="f-j">Jumlah (Rp)</label><input id="f-j" type="number" inputmode="numeric" min="0" step="1000" value="${d.jml}" placeholder="0">
    <div class="qs">${[20000,50000,100000,200000].map(v=>`<button type="button" data-q="${v}">${(v/1000)} rb</button>`).join("")}</div>
    <small id="f-p" style="margin-top:8px"></small>
    <label for="f-t">Tanggal terima</label><input id="f-t" type="date" value="${d.tgl||""}">
    <label for="f-c">Catatan (boleh kosong)</label><input id="f-c" value="${E(d.cat||"")}" placeholder="mis. titip lewat Bu RW">`,
   {ok:e?"Simpan perubahan":"Simpan setoran",
    onDel:e&&(async()=>{await del("setoran",e.id)}),
    onOk:async()=>{
      const mid=ft("f-mid").value,jml=Math.round(parseFloat(ft("f-j").value));
      if(!mid){toast("Pilih nama anggota");return false}
      if(!(jml>0)){toast("Isi jumlah setoran");return false}
      const id=await put("setoran",{id:e?e.id:null,pid:e?e.pid:p.id,mid,b:+ft("f-b").value,jml,tgl:ft("f-t").value,cat:ft("f-c").value.trim()});
      toast(e?"Perubahan tersimpan":"Setoran tersimpan","Bagikan bukti",()=>slipSheet(mid,id));
    }});
  const ov=document.querySelector(".ov:last-child"),pv=()=>{const v=parseFloat(ft("f-j").value);ft("f-p").textContent=v>0?rp(v):""};
  ov.addEventListener("input",pv);pv();
  ov.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ft("f-j").value=b.dataset.q;pv()});
}
function fTarik(o={}){
  const a=agg(),p=a.p,e=o.id&&TR.find(x=>x.id===o.id),d=e||{mid:o.mid||"",jml:"",tgl:today(),cat:""};
  sheet(e?"Ubah penarikan":"Penarikan tabungan",
   `<label for="f-mid">Anggota</label><select id="f-mid">${memberOpts(d.mid)}</select>
    <label for="f-j">Jumlah (Rp)</label><input id="f-j" type="number" inputmode="numeric" min="0" step="1000" value="${d.jml}" placeholder="0">
    <small id="f-p" style="margin-top:8px"></small>
    <label for="f-t">Tanggal</label><input id="f-t" type="date" value="${d.tgl||""}">
    <label for="f-c">Catatan</label><input id="f-c" value="${E(d.cat||"")}" placeholder="mis. dibagikan menjelang Lebaran">`,
   {ok:"Simpan",onDel:e&&(async()=>{await del("tarik",e.id)}),
    onOk:async()=>{
      const mid=ft("f-mid").value,jml=Math.round(parseFloat(ft("f-j").value));
      if(!mid){toast("Pilih nama anggota");return false}
      if(!(jml>0)){toast("Isi jumlah penarikan");return false}
      await put("tarik",{id:e?e.id:null,pid:e?e.pid:p.id,mid,jml,tgl:ft("f-t").value,cat:ft("f-c").value.trim()});
      toast("Penarikan tersimpan");
    }});
  const ov=document.querySelector(".ov:last-child"),upd=()=>{
    const m=ft("f-mid").value,v=parseFloat(ft("f-j").value)||0,s=m?(a.tot[m]-a.tk[m]+(e&&e.mid===m?e.jml:0)):0;
    ft("f-p").innerHTML=m?`Saldo sekarang ${rp(s)}${v>s?' · <span class="neg">melebihi saldo</span>':""}`:""};
  ov.addEventListener("input",upd);ov.addEventListener("change",upd);upd();
}
function fAnggota(id){
  const m=id&&M.find(x=>x.id===id);
  sheet(m?"Ubah anggota":"Anggota baru",
   `<label for="f-n">Nama</label><input id="f-n" value="${E(m?m.nama:"")}" placeholder="mis. Bu Siti" autocomplete="off">
    <label for="f-w">Nomor WhatsApp (boleh kosong)</label><input id="f-w" inputmode="tel" value="${E(m?m.wa||"":"")}" placeholder="08xxxxxxxxxx">`,
   {ok:m?"Simpan":"Tambah anggota",
    onDel:m&&(async()=>{
      const sx=SE.filter(x=>x.mid===m.id),tx=TR.filter(x=>x.mid===m.id);
      for(const x of sx)await del("setoran",x.id);for(const x of tx)await del("tarik",x.id);await del("anggota",m.id);
      S.mid=null;toast("Anggota dihapus");
    }),
    onOk:async()=>{
      const nama=ft("f-n").value.trim();if(!nama){toast("Isi nama anggota");return false}
      if(M.some(x=>x.id!==(m&&m.id)&&x.nama.toLowerCase()===nama.toLowerCase())&&!confirmDup(nama))return false;
      const no=m?m.no:(M.reduce((s,x)=>Math.max(s,x.no||0),0)+1);
      const nid=await put("anggota",{id:m?m.id:null,nama,wa:ft("f-w").value.trim(),no});
      if(!m){S.mid=nid;S.tab="mem"}toast(m?"Data anggota tersimpan":"Anggota ditambahkan");
    }});
}
let dupSeen=null;
function confirmDup(n){if(dupSeen===n)return true;dupSeen=n;toast("Nama itu sudah ada. Ketuk simpan lagi jika memang orang berbeda.");return false}

function cellSheet(mid,b){
  const a=agg(),p=a.p,m=M.find(x=>x.id===mid),xs=SE.filter(x=>x.pid===p.id&&x.mid===mid&&x.b===b);
  if(!xs.length){fSetor({mid,b});return}
  const s=sheet(m.nama+" · "+mlabel(p,b,1),
   `<div class="card" style="margin-top:10px">${xs.map(x=>`<button class="li" data-e="${x.id}"><div><b>${rp(x.jml)}</b><small>${tgl(x.tgl)}${x.cat?" · "+E(x.cat):""}</small></div><span class="mut">Ubah</span></button>`).join("")}</div>
    <div class="ar"><button class="btn pri" data-n>+ Tambah setoran</button></div>`);
  s.ov.addEventListener("click",e=>{
    const t=e.target.closest("[data-e]"),n=e.target.closest("[data-n]");
    if(t){s.close();fSetor({id:t.dataset.e})}if(n){s.close();fSetor({mid,b})}});
}

function fPeriode(id){
  const p=id&&P.find(x=>x.id===id),[y0,m0]=(p?p.mulai:today().slice(0,7)).split("-").map(Number);
  sheet(p?"Ubah periode":"Periode baru",
   `<label for="f-n">Nama periode</label><input id="f-n" value="${E(p?p.nama:"Tabungan "+y0)}">
    <label for="f-m">Bulan pertama</label><select id="f-m">${BLN.map((n,i)=>`<option value="${i+1}"${i+1===m0?" selected":""}>${n}</option>`).join("")}</select>
    <label for="f-y">Tahun bulan pertama</label><input id="f-y" type="number" inputmode="numeric" value="${y0}">
    <label for="f-k">Jumlah bulan</label><input id="f-k" type="number" inputmode="numeric" min="1" max="24" value="${p?p.n:11}">
    ${p?`<small style="margin-top:10px">Mengubah bulan pertama hanya mengganti nama bulan dan tahun. Setoran yang sudah dicatat tetap di urutan bulannya.</small>`:""}`,
   {ok:p?"Simpan":"Mulai periode",
    onOk:async()=>{
      const nama=ft("f-n").value.trim(),y=+ft("f-y").value,mo=+ft("f-m").value,n=Math.max(1,Math.min(24,+ft("f-k").value||11));
      if(!nama||!(y>2000)){toast("Lengkapi nama dan tahun");return false}
      const mulai=y+"-"+String(mo).padStart(2,"0");
      if(p){await put("periode",{...p,nama,mulai,n:Math.max(n,1)})}
      else{for(const x of P.filter(x=>x.aktif))await put("periode",{...x,aktif:false});
        const nid=await put("periode",{nama,mulai,n,aktif:true,dibuat:today()});S.pid=nid;S.bi=null}
      toast(p?"Periode tersimpan":"Periode baru dimulai");
    }});
}
function periodeSheet(){
  const s=sheet("Periode tabungan",
   `<div class="card" style="margin-top:10px">${P.slice().reverse().map(x=>`<button class="li" data-p="${x.id}"><div><b>${E(x.nama)}</b><small>${mlabel(x,0,1)} – ${mlabel(x,x.n-1,1)}${x.aktif?" · berjalan":""}</small></div>${x.id===per().id?'<span class="pill">Dilihat</span>':""}</button>`).join("")}</div>
    ${canW?`<div class="ar"><button class="btn" data-ed>Ubah periode ini</button><button class="btn pri" data-new>Periode baru</button></div>`:""}`);
  s.ov.addEventListener("click",e=>{
    const t=e.target.closest("[data-p]");
    if(t){S.pid=t.dataset.p;S.bi=null;s.close();render()}
    if(e.target.closest("[data-ed]")){s.close();fPeriode(per().id)}
    if(e.target.closest("[data-new]")){s.close();fPeriode()}});
}

/* ---------- bukti / rekap (Warga dan Pribadi) ---------- */
function slipW(mid,sid){
  const a=agg(),p=a.p,m=M.find(x=>x.id===mid),s=sid&&SE.find(x=>x.id===sid);
  const rows=[];a.cell[mid].forEach((v,b)=>{if(v)rows.push([mlabel(p,b,1),rp(v)])});
  return{ttl:"Tabungan Warga Mendungan",sub:p.nama,nama:m.nama,wa:m.wa||"",c:"#0B5D55",
    hl:s?{when:s.tgl?tgl(s.tgl):"",label:"untuk "+mlabel(p,s.b,1),jml:s.jml}:null,
    rows,tot:a.tot[mid],tk:a.tk[mid],saldo:a.tot[mid]-a.tk[mid]};
}
function slipText(x){
  let t=`*${x.ttl.toUpperCase()}*\n${x.sub}\n\nNama: *${x.nama}*\n`;
  if(x.hl)t+=`\n*Setoran diterima*\n${[x.hl.when,x.hl.label].filter(Boolean).join(" · ")}\n*${rp(x.hl.jml)}*\n`;
  t+=`\n*Rincian setoran*\n`+(x.rows.map(r=>`• ${r[0]}: ${r[1]}`).join("\n")||"(belum ada setoran)")+`\n\nTotal setoran: ${rp(x.tot)}\n`;
  if(x.tk)t+=`Penarikan: -${rp(x.tk)}\n`;
  return t+`*Saldo tabungan: ${rp(x.saldo)}*\n\nTerima kasih 🙏`;
}

    T(rp(x.hl.jml),W-P0,y+32,"700 24px Figtree,sans-serif","#16211e","right");y+=82}
  g.strokeStyle="#c9d6d3";g.setLineDash([5,4]);g.beginPath();g.moveTo(P0,y);g.lineTo(W-P0,y);g.stroke();g.setLineDash([]);y+=34;
  rows.forEach(r=>{T(r[0],P0,y,"500 17px Figtree,sans-serif","#16211e");T(r[1],W-P0,y,"500 17px Figtree,sans-serif","#16211e","right");y+=38});
  y+=4;g.beginPath();g.moveTo(P0,y-20);g.lineTo(W-P0,y-20);g.stroke();

  g.fillStyle=x.c;g.beginPath();g.roundRect?g.roundRect(P0,y,W-2*P0,64,14):g.rect(P0,y,W-2*P0,64);g.fill();
  T("SALDO TABUNGAN",P0+22,y+39,"700 14px Figtree,sans-serif","#F7D58A");T(rp(x.saldo),W-P0-22,y+42,"700 28px 'Bricolage Grotesque',sans-serif","#fff","right");
  T("Terima kasih",W/2,y+100,"500 14px Figtree,sans-serif","#7b8c88","center");
  return new Promise(r=>c.toBlob(r,"image/png"));

/* ---------- kirim gambar ke WhatsApp ---------- */
async function shareImg(getBlob,fn,text){
  let b;try{b=await getBlob()}catch(e){toast("Gambar belum bisa dibuat");return}
  if(window.Android&&window.Android.shareImage){
    const u=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
    try{window.Android.shareImage(u,fn)}catch(e){toast("Gambar belum bisa dikirim")}return}
  try{const file=new File([b],fn,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  if(dl){try{await dl.save({filename:fn,data:b});toast("Gambar disimpan. Lampirkan di WhatsApp.")}catch(e){if(!e||e.code!=="declined")toast("Gambar belum bisa dikirim di sini")}}
  else toast("Gambar belum bisa dikirim di sini");
}
function slipShow(x){
  const txt=slipText(x);let ph=(x.wa||"").replace(/\D/g,"");if(ph[0]==="0")ph="62"+ph.slice(1);
  const wa=`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`;
  const s=sheet(x.hl?"Bukti setoran":"Rekap tabungan",
   `${slipHtml(x)}<div class="ar" style="flex-wrap:wrap"><button class="btn pri" data-wai>Kirim WhatsApp</button><button class="btn" data-cp>Salin teks</button></div>
    <small style="margin-top:8px">Kirim WhatsApp mengirim gambar bukti. Pilih WhatsApp di menu bagikan HP.</small>
    ${dl?`<div class="ar" style="margin-top:8px"><button class="btn" data-png>Simpan gambar</button></div>`:""}`);
  s.ov.addEventListener("click",async e=>{
    if(e.target.closest("[data-wai]"))shareImg(()=>slipPng(x),"bukti-"+x.nama.replace(/\W+/g,"-")+".png",txt);
    if(e.target.closest("[data-cp]")){try{await navigator.clipboard.writeText(txt);toast("Teks tersalin")}catch(_){const ta=document.createElement("textarea");ta.value=txt;s.ov.querySelector(".sh").appendChild(ta);ta.select();toast("Pilih teks lalu salin")}}
    if(e.target.closest("[data-png]")){try{const b=await slipPng(x);await dl.save({filename:"bukti-"+x.nama.replace(/\W+/g,"-")+".png",data:b})}catch(err){if(!err||err.code!=="declined")toast("Gambar belum bisa disimpan di sini")}}});
}

/* ---------- ekspor tabel: Excel bila tersedia, CSV bila tidak (mis. di APK) ---------- */
const csvCell=v=>{if(v==null)return"";v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
async function saveCsv(base,aoa){
  const txt="\ufeff"+aoa.map(r=>r.map(csvCell).join(";")).join("\r\n");
  try{await dl.save({filename:base+".csv",data:txt});toast("Tabel disimpan, buka dengan Excel atau WPS")}
  catch(e){if(!e||e.code!=="declined")toast("File belum bisa disimpan di sini")}
}
async function exportXlsx(){
  const a=agg(),p=a.p,bulan=[...Array(p.n)].map((_,b)=>mlabel(p,b,1));
  const head=["No","Nama",...bulan,"Jumlah setoran","Penarikan","Saldo"];
  const rows=M.map((m,i)=>[i+1,m.nama,...a.cell[m.id].map(v=>v||null),a.tot[m.id],a.tk[m.id]||null,a.tot[m.id]-a.tk[m.id]]);
  rows.push(["","Jumlah",...a.bln,a.grand,a.grandTk||null,a.kas]);
  if(!xlsxOk)return saveCsv("Tabungan-Warga-Mendungan-"+p.mulai,[["Tabungan Warga Mendungan"],[p.nama],[],head,...rows]);
  const ws=XLSX.utils.aoa_to_sheet([["Tabungan Warga Mendungan"],[p.nama],[],head,...rows]);
  Object.keys(ws).forEach(k=>{if(k[0]!=="!"&&ws[k].t==="n"&&XLSX.utils.decode_cell(k).c>1)ws[k].z="#,##0"});
  ws["!cols"]=[{wch:5},{wch:22},...bulan.map(()=>({wch:12})),{wch:15},{wch:12},{wch:15}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Tabungan");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{await dl.save({filename:"Tabungan-Warga-Mendungan-"+p.mulai+".xlsx",data:buf});toast("Excel disimpan")}
  catch(e){if(!e||e.code!=="declined")toast("File belum bisa disimpan di sini")}
}

const mkL=(k,long)=>{const [y,m]=k.split("-").map(Number);return long?BLN[m-1]+" "+y:BLN[m-1].slice(0,3)+" "+String(y).slice(2)};
const curMk=()=>today().slice(0,7);
const GR=[["#2A9FEF","#0B6FC4"],["#5B8DEF","#2B57C9"],["#17A9BC","#0B7C90"],["#7C88F0","#4753C6"]];
const gp=o=>GR[(Math.max(1,o.no||1)-1)%GR.length];
const hid=s=>S.hide?"Rp ••••••":s;
const dkey=x=>x.tgl||(x.bln?x.bln+"-01":"0000-00-00");
const pwhen=x=>x.tgl?tgl(x.tgl):mkL(x.bln,1);
const pname=id=>(PO.find(o=>o.id===id)||{nama:"?"}).nama;
const sortO=()=>PO.sort((x,y)=>(x.no||0)-(y.no||0)||x.nama.localeCompare(y.nama));
function pagg(){
  const t={},tk={},cell={};PO.forEach(o=>{t[o.id]=0;tk[o.id]=0;cell[o.id]={}});
  PS.forEach(x=>{if(!cell[x.mid])return;cell[x.mid][x.bln]=(cell[x.mid][x.bln]||0)+x.jml;t[x.mid]+=x.jml});
  PT.forEach(x=>{if(x.mid in tk)tk[x.mid]+=x.jml});
  const grand=Object.values(t).reduce((s,v)=>s+v,0),grandTk=Object.values(tk).reduce((s,v)=>s+v,0);
  return{t,tk,cell,grand,grandTk,saldo:grand-grandTk};
}
function mrange(lo,hi){const out=[];let [y,m]=lo.split("-").map(Number);for(let i=0;i<60;i++){const k=y+"-"+String(m).padStart(2,"0");out.push(k);if(k>=hi)break;m++;if(m>12){m=1;y++}}return out.slice(-36)}
function pmonths(a,mid){const ks=Object.keys(a.cell[mid]).sort(),cur=curMk();let hi=ks.length?ks[ks.length-1]:cur;if(hi<cur)hi=cur;return mrange(ks[0]||cur,hi)}
function pmut(mid){return[...PS.map(x=>({t:"s",x})),...PT.map(x=>({t:"t",x}))].filter(r=>!mid||r.x.mid===mid).sort((u,v)=>dkey(v.x).localeCompare(dkey(u.x))||(v.x.bln||"").localeCompare(u.x.bln||""))}
function slipP(mid,sid){
  const a=pagg(),o=PO.find(x=>x.id===mid),s=sid&&PS.find(x=>x.id===sid);
  return{ttl:"Tabungan Pribadi",sub:"Rekap tabungan",nama:o.nama,wa:o.wa||"",c:"#0B7AD1",
    hl:s?{when:s.tgl?tgl(s.tgl):"",label:"untuk "+mkL(s.bln,1),jml:s.jml}:null,
    rows:Object.keys(a.cell[mid]).sort().map(k=>[mkL(k,1),rp(a.cell[mid][k])]),tot:a.t[mid],tk:a.tk[mid],saldo:a.t[mid]-a.tk[mid]};
}

function fPTarik(o={}){

function fPOrang(id){
  const o=id&&PO.find(x=>x.id===id);

   `<label for="f-n">Nama</label><input id="f-n" value="${E(o?o.nama:"")}" placeholder="mis. Putri" autocomplete="off">

/* Excel */
async function exportP(){
  const a=pagg(),cur=curMk(),ks=[...new Set(PO.flatMap(o=>Object.keys(a.cell[o.id])))].sort(),ms=ks.length?mrange(ks[0],ks[ks.length-1]<cur?cur:ks[ks.length-1]):[cur];
  const r1=[["Tabungan Pribadi"],[],["Nama",...ms.map(k=>mkL(k,1)),"Total setoran","Penarikan","Saldo"],
    ...PO.map(o=>[o.nama,...ms.map(k=>a.cell[o.id][k]||null),a.t[o.id],a.tk[o.id]||null,a.t[o.id]-a.tk[o.id]]),
    ["Jumlah",...ms.map(k=>PO.reduce((s,o)=>s+(a.cell[o.id][k]||0),0)||null),a.grand,a.grandTk||null,a.saldo]];
  const r2=[["Tanggal / bulan","Nama","Jenis","Jumlah","Catatan"],...pmut().reverse().map(r=>[pwhen(r.x),pname(r.x.mid),r.t==="s"?"Setoran":"Penarikan",r.x.jml,r.x.cat||""])];
  if(!xlsxOk)return saveCsv("Tabungan-Pribadi",[...r1,[],["Mutasi"],...r2]);
  const w1=XLSX.utils.aoa_to_sheet(r1),w2=XLSX.utils.aoa_to_sheet(r2);
  [w1,w2].forEach(w=>Object.keys(w).forEach(k=>{if(k[0]!=="!"&&w[k].t==="n"&&XLSX.utils.decode_cell(k).c>0)w[k].z="#,##0"}));
  w1["!cols"]=[{wch:16},...ms.map(()=>({wch:14})),{wch:15},{wch:12},{wch:15}];w2["!cols"]=[{wch:18},{wch:16},{wch:12},{wch:14},{wch:28}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,"Ringkasan");XLSX.utils.book_append_sheet(wb,w2,"Mutasi");
  try{await dl.save({filename:"Tabungan-Pribadi.xlsx",data:XLSX.write(wb,{bookType:"xlsx",type:"array"})});toast("Excel disimpan")}
  catch(e){if(!e||e.code!=="declined")toast("File belum bisa disimpan di sini")}
}

function checkBackup(text){
  let j;try{j=JSON.parse(text)}catch(e){return null}
  if(!j||j.app!=="tabungan"||!j.data||typeof j.data!=="object")return null;
  const ok={dkas:canW,dcfg:canW,anggota:canW,setoran:canW,tarik:canW,periode:canW,pribadi:isAdm,pset:isAdm,ptarik:isAdm},out={};let n=0,skip=0;
  for(const c of Object.keys(RV)){
    if(!ok[c]||!Array.isArray(j.data[c]))continue;
    out[c]=[];
    for(const d of j.data[c]){
      if(d&&typeof d==="object"&&str(d.id)&&/^[A-Za-z0-9_.~:@+-]{1,200}$/.test(d.id)&&d.id!=="."&&d.id!==".."&&RV[c](d)){const x={...d},id=x.id;delete x.id;out[c].push([id,x]);n++}else skip++;
    }
  }
  return n?{out,n,skip,when:j.dibuat}:null;
}

  const watch=(name,set)=>db.collection(name).onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));S.ready[name]=true;render()},e=>{S.err=e&&e.code||"x";render()});
  watch("anggota",v=>M=v);watch("setoran",v=>SE=v);watch("tarik",v=>TR=v);watch("periode",v=>P=v.sort((x,y)=>x.mulai.localeCompare(y.mulai)));
  watch("dkas",v=>DK=v);watch("dcfg",v=>DC=v);
  if(isAdm){watch("pribadi",v=>PO=v);watch("pset",v=>PS=v);watch("ptarik",v=>PT=v)}
  render();
}
boot();
</script>
